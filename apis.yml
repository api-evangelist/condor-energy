name: Condor Energy
description: Condor Energy is an AI-powered energy management operating system for enterprise energy
  procurement, built for industrial companies, retailers, and data center operators who buy electricity
  at scale. The platform aggregates consumption data, PPAs, solar, batteries, and live market data into
  real-time dashboards; models load against market dynamics to execute hedging strategies and produce
  board-ready price-risk reporting; and analyzes granular load data to find flexibility opportunities and
  evaluate ROI on solar, battery, EV-charging, and hybrid investments. Founded in 2026 by former electricity
  traders and energy physicists, the Paris-based company is a Y Combinator Winter 2026 company. No public
  API, developer portal, or SDK is published as of this profile.
